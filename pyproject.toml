[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carousearch"
version = "0.1.0"
description = "Search Carousell Singapore with structured filters: client, CLI, canary, a Telegram bot, a local web app, an MCP server and an agent that uses it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160",
    "httpx>=0.27",
    "jinja2>=3.1",
    # MCP server for agent hosts (`carousearch mcp`). mcp 2 renamed FastMCP to MCPServer; 3 may change it again.
    "mcp>=2.3,<3",
    # Downsizes listing photos for the MCP server's listing_photo tool.
    "pillow>=13",
    "pydantic>=2.7",
    # The `carousearch ask` agent: model-neutral (Anthropic or OpenAI by AGENT_MODEL), tools from our MCP server.
    "pydantic-ai-slim[anthropic,mcp,openai]>=2.61,<3",
    "python-dotenv>=1.0",
    "python-telegram-bot>=22,<23",
    "uvicorn>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]
# Screening's price resolver (Claude). Without it, and without ANTHROPIC_API_KEY, screening keeps listed prices.
llm = [
    "anthropic>=2.3",
]

[project.scripts]
carousearch = "carousearch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carousearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits the real carousell.sg site (deselected by default; run with: pytest -m live)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["carousearch"]
# Helper modules that pytest imports from the tests/ folder.
known-local-folder = ["fake_carousell", "fixture_files"]
